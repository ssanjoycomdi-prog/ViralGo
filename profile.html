<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViralGo Profile</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    .profile {
      max-width: 600px;
      margin: auto;
      background: white;
      min-height: 100vh;
    }

    .topbar {
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }

    .profile-header {
      text-align: center;
      padding: 25px 15px;
    }

    .avatar {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ff2d55;
      margin-bottom: 12px;
    }

    .username {
      font-size: 24px;
      font-weight: bold;
    }

    .handle {
      color: #777;
      margin-top: 5px;
    }

    .bio {
      margin: 15px auto;
      max-width: 400px;
      line-height: 1.5;
      color: #444;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 35px;
      margin: 20px 0;
    }

    .stat {
      text-align: center;
    }

    .number {
      font-size: 20px;
      font-weight: bold;
    }

    .label {
      color: #777;
      font-size: 14px;
      margin-top: 4px;
    }

    .edit-btn {
      border: none;
      background: #111;
      color: white;
      padding: 11px 28px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
    }

    .tabs {
      display: flex;
      border-top: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 15px;
      font-weight: bold;
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }

    .video {
      height: 180px;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      cursor: pointer;
    }

    .video span {
      background: rgba(0,0,0,.6);
      color: white;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .video {
        height: 150px;
      }
    }
  </style>
</head>

<body>

  <div class="profile">

    <div class="topbar">
      ViralGo
    </div>

    <div class="profile-header">

      <img
        class="avatar"
        src="https://i.pravatar.cc/300"
        alt="Profile"
      >

      <div class="username">
        Sanjoy
      </div>

      <div class="handle">
        @sanjoy
      </div>

      <div class="bio">
        Welcome to my ViralGo profile 🎬
        <br>
        Short videos • Entertainment • Fun
      </div>

      <div class="stats">

        <div class="stat">
          <div class="number">120</div>
          <div class="label">Videos</div>
        </div>

        <div class="stat">
          <div class="number">5.2K</div>
          <div class="label">Followers</div>
        </div>

        <div class="stat">
          <div class="number">320</div>
          <div class="label">Following</div>
        </div>

      </div>

      <button class="edit-btn">
        Edit Profile
      </button>

    </div>

    <div class="tabs">
      <div class="tab">Videos</div>
      <div class="tab">Liked</div>
    </div>

    <div class="videos">

      <div class="video">
        <span>▶ 12K</span>
      </div>

      <div class="video">
        <span>▶ 8.5K</span>
      </div>

      <div class="video">
        <span>▶ 25K</span>
      </div>

      <div class="video">
        <span>▶ 6.2K</span>
      </div>

      <div class="video">
        <span>▶ 18K</span>
      </div>

      <div class="video">
        <span>▶ 32K</span>
      </div>

    </div>

  </div>

</body>
</html>
